services:
  agent-retrieval:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fireguard-agent-retrieval
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
    volumes:
      - ../fireguard-vector-store/data:/app/data:ro
      - ./data/hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fireguard-net

networks:
  fireguard-net:
    external: true
    name: fireguard-vector-store_fireguard-net
